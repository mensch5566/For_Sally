<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For Sally</title>
<meta name="theme-color" content="#050404">
<style>
  /* Opens straight onto Lulu's golden-thread video until the cutoff; after it, only the 404 card. */
  :root {
    --night: #050404;
    --gold-dim: rgba(233, 200, 121, 0.75);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--night);
    overflow: hidden;
    padding:
      env(safe-area-inset-top, 0px)
      env(safe-area-inset-right, 0px)
      env(safe-area-inset-bottom, 0px)
      env(safe-area-inset-left, 0px);
    -webkit-tap-highlight-color: transparent;
  }
  .stage { height: 100%; position: relative; }
  .film, .gone-card {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: contain;
    background: var(--night); display: block;
  }
  .sound-hint {
    position: absolute;
    left: 0; right: 0;
    bottom: calc(20px + env(safe-area-inset-bottom, 0px));
    margin: 0;
    text-align: center;
    font: 14px/1.4 -apple-system, "PingFang TC", "Noto Sans TC", sans-serif;
    letter-spacing: 0.12em;
    color: var(--gold-dim);
    pointer-events: none;
    transition: opacity 0.6s ease;
  }
  .sound-hint.gone { opacity: 0; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main class="stage" id="stage"></main>

<script>
  // Card is shown until the end of 2026-11-18 23:59 Taiwan time (UTC+8).
  const CUTOFF = new Date('2026-11-19T00:00:00+08:00').getTime();
  const stage = document.getElementById('stage');

  if (Date.now() >= CUTOFF) {
    const img = document.createElement('img');
    img.className = 'gone-card';
    img.src = '404.jpg';
    img.alt = '404';
    stage.appendChild(img);
  } else {
    const film = document.createElement('video');
    film.className = 'film';
    film.src = 'Lulu_for_Sally.mp4';
    film.autoplay = true;
    film.muted = true;
    film.playsInline = true;
    film.setAttribute('playsinline', '');
    film.preload = 'auto';
    stage.appendChild(film);

    const hint = document.createElement('p');
    hint.className = 'sound-hint';
    hint.textContent = '輕觸畫面開啟聲音';
    hint.hidden = true;
    stage.appendChild(hint);

    const hideHint = () => {
      hint.classList.add('gone');
      setTimeout(() => { hint.hidden = true; }, 700);
    };

    // Try with sound first; browsers usually refuse, so fall back to muted autoplay.
    film.muted = false;
    film.play().then(() => {
      hint.hidden = true;
    }).catch(() => {
      film.muted = true;
      film.play().catch(() => {});
      if (!film.ended) hint.hidden = false;
    });

    // First tap anywhere turns the sound on.
    document.addEventListener('pointerdown', () => {
      if (!film.muted) return;
      film.muted = false;
      if (film.paused && !film.ended) film.play().catch(() => {});
      hideHint();
    }, { once: true });

    // Stay on the last frame; no replay.
    film.addEventListener('ended', () => { if (!hint.hidden) hideHint(); });
  }
</script>
</body>
</html>
