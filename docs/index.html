<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For Sally</title>
<meta name="theme-color" content="#050404">
<style>
  /* Opens straight onto Lulu's golden-thread video; ends on the last frame. */
  :root {
    --night: #050404;
    --gold-dim: rgba(233, 200, 121, 0.75);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--night);
    overflow: hidden;
    padding:
      env(safe-area-inset-top, 0px)
      env(safe-area-inset-right, 0px)
      env(safe-area-inset-bottom, 0px)
      env(safe-area-inset-left, 0px);
    -webkit-tap-highlight-color: transparent;
  }
  .stage { height: 100%; display: grid; place-items: center; position: relative; }
  .film {
    height: 100%; max-height: 100%; max-width: 100%;
    aspect-ratio: 9 / 16; object-fit: contain;
    background: var(--night); display: block;
  }
  .sound-hint {
    position: absolute;
    left: 0; right: 0;
    bottom: calc(20px + env(safe-area-inset-bottom, 0px));
    margin: 0;
    text-align: center;
    font: 14px/1.4 -apple-system, "PingFang TC", "Noto Sans TC", sans-serif;
    letter-spacing: 0.12em;
    color: var(--gold-dim);
    pointer-events: none;
    transition: opacity 0.6s ease;
  }
  .sound-hint.gone { opacity: 0; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main class="stage">
  <video class="film" id="film" src="Lulu_for_Sally.mp4" autoplay muted playsinline preload="auto"></video>
  <p class="sound-hint" id="hint" hidden>輕觸畫面開啟聲音</p>
</main>

<script>
  const film = document.getElementById('film');
  const hint = document.getElementById('hint');

  function hideHint() {
    hint.classList.add('gone');
    setTimeout(() => { hint.hidden = true; }, 700);
  }

  // Try with sound first; browsers usually refuse, so fall back to muted autoplay.
  film.muted = false;
  film.play().then(() => {
    hint.hidden = true;
  }).catch(() => {
    film.muted = true;
    film.play().catch(() => {});
    if (!film.ended) hint.hidden = false;
  });

  // First tap anywhere turns the sound on.
  document.addEventListener('pointerdown', () => {
    if (!film.muted) return;
    film.muted = false;
    if (film.paused && !film.ended) film.play().catch(() => {});
    hideHint();
  }, { once: true });

  // Stay on the last frame; no replay.
  film.addEventListener('ended', () => { if (!hint.hidden) hideHint(); });
</script>
</body>
</html>
