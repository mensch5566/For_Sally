<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For Sally</title>
<meta name="theme-color" content="#000000">
<style>
  /* Opens straight onto Lulu's golden-thread video until the cutoff; after it, only the 404 card. */
  :root {
    --night: #000000;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--night);
    overflow: hidden;
    padding:
      env(safe-area-inset-top, 0px)
      env(safe-area-inset-right, 0px)
      env(safe-area-inset-bottom, 0px)
      env(safe-area-inset-left, 0px);
    -webkit-tap-highlight-color: transparent;
  }
  .stage { height: 100%; position: relative; }
  .film, .gone-card {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: contain;
    background: var(--night); display: block;
  }
</style>
</head>
<body>
<main class="stage" id="stage"></main>

<script>
  // Card is shown until the end of 2026-11-18 23:59 Taiwan time (UTC+8).
  const CUTOFF = new Date('2026-11-19T00:00:00+08:00').getTime();
  const stage = document.getElementById('stage');

  // ?preview=404 shows the after-cutoff card early (it can never bring the video back).
  const preview404 = new URLSearchParams(location.search).get('preview') === '404';
  if (preview404 || Date.now() >= CUTOFF) {
    const img = document.createElement('img');
    img.className = 'gone-card';
    img.src = '404.jpg';
    img.alt = '404';
    stage.appendChild(img);
  } else {
    const film = document.createElement('video');
    film.className = 'film';
    film.src = 'Lulu_for_Sally.mp4';
    film.autoplay = true;
    film.muted = true;
    film.playsInline = true;
    film.setAttribute('playsinline', '');
    film.preload = 'auto';
    stage.appendChild(film);

    // Try with sound first; browsers usually refuse, so fall back to muted autoplay.
    film.muted = false;
    film.play().catch(() => {
      film.muted = true;
      film.play().catch(() => {});
    });

    // A tap anywhere quietly turns the sound on. The video stays on its last frame when it ends.
    document.addEventListener('pointerdown', () => {
      if (!film.muted) return;
      film.muted = false;
      if (film.paused && !film.ended) film.play().catch(() => {});
    }, { once: true });
  }
</script>
</body>
</html>
